name: ZYLO Production CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  security-and-build:
    name: Security, Lint, Typecheck, E2E & Production Build
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/zylo_test_db?schema=public"
      NEXTAUTH_SECRET: "ci_pipeline_dummy_nextauth_secret_key_32_chars_min"
      NEXTAUTH_URL: "http://localhost:3000"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      NEXT_PUBLIC_APP_NAME: "ZYLO"
      NODE_ENV: "test"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Database Client
        run: npx prisma generate

      - name: Automated Secret Scanner (Req 5 & 10)
        run: node scripts/scan-secrets.mjs

      - name: TypeScript Type-Check
        run: npm run type-check

      - name: ESLint Code Quality
        run: npm run lint

      - name: Run Full Vitest Test Suite (Unit + Integration)
        run: npm run test

      - name: Run Primary 24-Step Master E2E Test (Req 1)
        run: npx vitest run tests/full-e2e-flow.test.ts

      - name: Production Next.js Build Verification
        run: npm run build
